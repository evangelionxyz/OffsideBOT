[package]
name = "offside-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
dotenv = "0.15.0"
dotenvy = "0.15.7"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serenity = { version = "0.12.5", features = ["cache", "client", "gateway", "model", "rustls_backend", "voice"] }
songbird = { version = "0.6.1", features = ["builtin-queue"] }
symphonia = { version = "0.5", features = ["all"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "process", "sync"] }
